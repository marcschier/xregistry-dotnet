name: nuget
run-name: Promote NuGet ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version without v (for example 1.0.0-rc4); no latest/default'
        required: true
        type: string

permissions: {}

concurrency:
  group: nuget-promotion
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'marcschier/xregistry-dotnet' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      selection: ${{ steps.resolve.outputs.selection }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Resolve and verify the exact qualifying artifact before approval
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python eng\release\release.py resolve

  publish:
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    steps:
      # Only trusted main workflow code is executed, never downloaded/tagged scripts.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - name: Verify real approval and recheck the pinned artifact after waiting
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SELECTION: ${{ needs.resolve.outputs.selection }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: python eng\release\release.py prepare
      - name: Exchange GitHub OIDC for a short-lived NuGet key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Promote the same verified package and symbol bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SELECTION: ${{ needs.resolve.outputs.selection }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: python eng\release\release.py push
