name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Tooling behavior and source consistency
        run: |
          python -m unittest discover -s tests/Tooling -v
          python eng/specification/manage.py check
          python eng/sync_models.py --check
          python eng/check_packages.py --check-projects

  managed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install independently hashed oracle dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r eng/requirements-oracles.lock
      - name: Build and evaluate package contracts
        shell: pwsh
        run: ./eng/build.ps1
      - name: Execute tests, rejecting empty suites
        shell: pwsh
        if: matrix.os == 'windows-latest'
        run: ./eng/test.ps1 -NoBuild -MaxParallelTestModules 1
      - name: Execute tests, rejecting empty suites (Linux)
        shell: pwsh
        if: matrix.os != 'windows-latest'
        run: ./eng/test.ps1 -NoBuild
      - name: Upload managed test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-test-diagnostics-${{ matrix.os }}
          path: |
            TestResults/**
            artifacts/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify source formatting
        run: dotnet format XRegistry.slnx --no-restore --verify-no-changes --severity warn

  specification-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install independently hashed oracle dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r eng/requirements-oracles.lock
      - name: Execute frozen and active-corrected non-OPC-UA specification corpora
        shell: pwsh
        run: ./eng/test-specification.ps1
      - name: Retain exact independent-oracle accounting
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specification-oracles
          path: |
            artifacts/specification-oracles/*/report.json
            artifacts/specification-oracles/*/results.xml
            artifacts/specification-oracles/*/accounting.json
            artifacts/specification-oracles/*/control.json
            artifacts/specification-oracles/*/pytest.log
            artifacts/specification-oracles/*/LICENSE
          if-no-files-found: error
