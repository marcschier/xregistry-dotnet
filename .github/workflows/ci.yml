name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Tooling behavior and source consistency
        run: |
          python -m unittest discover -s tests/Tooling -v
          python eng/specification/manage.py check
          python eng/sync_models.py --check
          python eng/check_packages.py --check-projects

  managed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install independently hashed oracle dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r eng/requirements-oracles.lock
      - name: Locked build and evaluated package contracts
        shell: pwsh
        run: ./eng/build.ps1
      - name: Execute tests, rejecting empty suites
        shell: pwsh
        run: ./eng/test.ps1 -NoBuild
      - name: Verify source formatting
        run: dotnet format XRegistry.slnx --no-restore --verify-no-changes --severity warn

  specification-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install independently hashed oracle dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r eng/requirements-oracles.lock
      - name: Execute frozen and active-corrected non-OPC-UA specification corpora
        shell: pwsh
        run: ./eng/test-specification.ps1
      - name: Retain exact independent-oracle accounting
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: specification-oracles
          path: |
            artifacts/specification-oracles/*/report.json
            artifacts/specification-oracles/*/results.xml
            artifacts/specification-oracles/*/accounting.json
            artifacts/specification-oracles/*/control.json
            artifacts/specification-oracles/*/pytest.log
            artifacts/specification-oracles/*/LICENSE
          if-no-files-found: error
