name: native-qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-all-package-consumers:
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Create isolated Linux ext4 consumer work directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang zlib1g-dev e2fsprogs
          truncate -s 256M "$RUNNER_TEMP/xregistry-embedding.ext4"
          mkfs.ext4 -q -F "$RUNNER_TEMP/xregistry-embedding.ext4"
          mkdir "$RUNNER_TEMP/xregistry-embedding-work"
          sudo mount -o loop,nosuid,nodev,noexec "$RUNNER_TEMP/xregistry-embedding.ext4" "$RUNNER_TEMP/xregistry-embedding-work"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/xregistry-embedding-work"
      - name: Restore exact repository package graph
        run: dotnet restore XRegistry.slnx --locked-mode
      - name: Pack and execute all eleven packages from a fresh feed/cache
        shell: pwsh
        run: |
          $work = if ($IsLinux) { Join-Path $env:RUNNER_TEMP 'xregistry-embedding-work' } else { $env:RUNNER_TEMP }
          ./eng/test-embedding-packages.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Framework '${{ matrix.framework }}' -WorkRoot $work
      - name: Retain package, source, native and JIT-control evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-all-packages-${{ matrix.rid }}-${{ matrix.framework }}
          path: |
            artifacts/embedding/*/*.json
            artifacts/embedding/*/*.log
            artifacts/embedding/*/feed/*
            artifacts/embedding/*/native/**
          if-no-files-found: error
          retention-days: 14
      - name: Unmount only this job's consumer work directory
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if mountpoint -q "$RUNNER_TEMP/xregistry-embedding-work"; then
            sudo umount "$RUNNER_TEMP/xregistry-embedding-work"
          fi
          rm -f "$RUNNER_TEMP/xregistry-embedding.ext4"

  native-model-consumers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Native Linux compiler prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang zlib1g-dev
      - name: Restore exact package graph
        run: dotnet restore XRegistry.slnx --locked-mode
      - name: Publish and execute both model-package consumer TFMs natively
        shell: pwsh
        run: ./eng/test-model-packages.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

  native-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm]
        framework: [net8.0, net10.0]
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Provision isolated Linux ext4 data volume
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang zlib1g-dev e2fsprogs
          truncate -s 256M "$RUNNER_TEMP/xregistry-native-data.ext4"
          mkfs.ext4 -q -F "$RUNNER_TEMP/xregistry-native-data.ext4"
          mkdir "$RUNNER_TEMP/xregistry-native-data"
          sudo mount -o loop,nosuid,nodev,noexec "$RUNNER_TEMP/xregistry-native-data.ext4" "$RUNNER_TEMP/xregistry-native-data"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/xregistry-native-data"
      - name: Restore exact package graph
        run: dotnet restore XRegistry.slnx --locked-mode
      - name: Execute native behavior and killed-process recovery
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'xregistry-native-data'
          ./eng/test-storage-native.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Framework '${{ matrix.framework }}' -DataRoot $data
      - name: Execute native durable HTTP sample
        if: matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'xregistry-native-data'
          ./eng/test-file-server.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -DataRoot $data
      - name: Retain native durable HTTP sample evidence
        if: always() && matrix.framework == 'net10.0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-file-server-${{ matrix.rid }}
          path: artifacts/file-server-native/${{ matrix.rid }}/evidence
          if-no-files-found: error
      - name: Retain native storage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-storage-${{ matrix.rid }}-${{ matrix.framework }}
          path: |
            artifacts/native-storage/${{ matrix.rid }}-${{ matrix.framework }}/results
            artifacts/native-storage/${{ matrix.rid }}-${{ matrix.framework }}/crashes.json
          if-no-files-found: error
      - name: Unmount only this job's Linux data volume
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if mountpoint -q "$RUNNER_TEMP/xregistry-native-data"; then
            sudo umount "$RUNNER_TEMP/xregistry-native-data"
          fi
          rm -f "$RUNNER_TEMP/xregistry-native-data.ext4"

  native-client-sample:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Native Linux compiler prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang zlib1g-dev
      - name: Restore exact package graph
        run: dotnet restore XRegistry.slnx --locked-mode
      - name: Execute actual native client over independent snapshots
        shell: pwsh
        run: ./eng/test-client-sample.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Retain native client qualification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-client-sample-${{ matrix.rid }}
          path: artifacts/client-native/${{ matrix.rid }}/qualification.json
          if-no-files-found: error

  native-bridge-sample:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - name: Native Linux compiler prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang zlib1g-dev
      - name: Restore exact package graph
        run: dotnet restore XRegistry.slnx --locked-mode
      - name: Execute the native producer bridge and JIT negative control
        shell: pwsh
        run: ./eng/test-bridge-sample.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Retain native bridge identity and HTTP evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-bridge-sample-${{ matrix.rid }}
          path: artifacts/bridge-native/${{ matrix.rid }}/evidence
          if-no-files-found: error
