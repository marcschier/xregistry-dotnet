name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'marcschier/xregistry-dotnet' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install independently hashed oracle dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r eng/requirements-oracles.lock
      - name: Qualify exact tag source and assemble explicit-version packages
        id: build
        shell: pwsh
        run: python eng\release\release.py build
      - name: Retain the complete immutable release payload
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: artifacts\release\payload\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false
      - name: Publish the verified packages to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python eng\release\release.py github

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No checkout or execution of package code in the signing job.
      - name: Attest the uploaded ZIP digest, not a rebuild
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ needs.build.outputs.artifact-name }}.zip
          subject-digest: sha256:${{ needs.build.outputs.artifact-digest }}
          create-storage-record: false
