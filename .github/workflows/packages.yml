name: package-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate build and publishing tooling
        run: python -B -m unittest discover -s tests/Tooling -p "test_*release*.py"
      - name: Verify package build contract
        run: python -B -m unittest discover -s tests/Tooling -p test_package_build.py
      - name: Locked build
        shell: pwsh
        run: ./eng/build.ps1
      - name: Build exact source-version packages without publishing
        run: python -B eng/package_build.py
      - name: Upload package and symbol inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-packages-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/ci-packages/*
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 30

  publish-github:
    name: publish to GitHub Packages
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify release qualification
        shell: pwsh
        run: |
          python eng/check_packages.py --release
          if ($LASTEXITCODE -ne 0) { throw 'Package release qualification is incomplete.' }
          python eng/specification/manage.py release
          if ($LASTEXITCODE -ne 0) { throw 'Specification release qualification is incomplete.' }
      - name: Pack
        run: |
          dotnet pack src/XRegistry/XRegistry.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Client/XRegistry.Client.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Server/XRegistry.Server.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.AspNetCore/XRegistry.AspNetCore.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Storage.File/XRegistry.Storage.File.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Models/XRegistry.Models.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Validation/XRegistry.Validation.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Federation/XRegistry.Federation.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Bindings.File/XRegistry.Bindings.File.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Bindings.Git/XRegistry.Bindings.Git.csproj -c Release -o artifacts/publish
          dotnet pack src/XRegistry.Bindings.Oci/XRegistry.Bindings.Oci.csproj -c Release -o artifacts/publish
      - name: List packages
        run: ls -l artifacts/publish
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/publish/*.nupkg"
          --source https://nuget.pkg.github.com/marcschier/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
